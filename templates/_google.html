<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const cfg = {{ firebase_config|tojson }};
const CSRF = document.querySelector('meta[name=csrf]').content;
const btns = document.querySelectorAll('[data-google]');
const MSG = {
  'auth/unauthorized-domain': 'This address is not authorized in Firebase. Open the site at http://localhost:5000 instead.',
  'auth/operation-not-allowed': 'Google sign-in is not enabled in the Firebase console yet.',
  'auth/popup-blocked': 'Your browser blocked the popup. Allow popups for this site and try again.',
  'auth/network-request-failed': 'Network problem. Check your internet connection.'
};
if (!cfg.apiKey) {
  btns.forEach(b => b.onclick = () => toast('Google sign-in is not set up yet. Add the Firebase settings to the .env file.', 'info'));
} else {
  const auth = getAuth(initializeApp(cfg));
  btns.forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const r = await signInWithPopup(auth, new GoogleAuthProvider());
      const idToken = await r.user.getIdToken();
      const res = await fetch('{{ url_for("firebase_login") }}', {method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF}, body:JSON.stringify({idToken})});
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Sign-in failed.');
      await auth.signOut();
      location.href = d.next;
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast(MSG[e.code] || e.message, 'error');
      b.disabled = false;
    }
  });
}
</script>
